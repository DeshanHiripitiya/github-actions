
name: Artifact Transfer Practice

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create binary
        run: |
          mkdir -p dist
          echo "This is my build output" > dist/app.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-build
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: wrong-name
          path: dist/

      - name: Check downloaded file
        run: |
          ls -la dist/
          cat dist/app.bin
