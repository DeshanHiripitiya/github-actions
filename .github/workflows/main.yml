
name: Artifact Transfer Practice

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create sample files
        run: |
          mkdir -p dist
          echo "Application binary" > dist/app.bin
          echo "Debug information" > dist/debug.log
          echo "Temporary data" > dist/temp.txt
          echo "Configuration" > dist/config.json

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: production-build
          path: |
            dist/**
            !dist/debug.log
            !dist/temp.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: production-build
          path: downloaded/

      - name: Check downloaded file
        run: |
          echo "Files inside downloaded artifact:"
          find downloaded -type f
